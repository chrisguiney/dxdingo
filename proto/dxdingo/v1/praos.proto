syntax = "proto3";

package dxdingo.v1;

import "dxdingo/v1/state.proto";
import "dxdingo/v1/types.proto";

option go_package = "github.com/chrisguiney/dxdingo/gen/go/dxdingo/v1;dxdingov1";

// praos: header validity and nonce evolution.

// Header envelope size checks (Shelley.Protocol.EnvelopeChecks): the encoded
// header against max_block_header_size, then the body size the header
// declares against max_block_body_size. header is the era's block header CBOR.
message PraosHeaderEnvelopeRequest {
  reserved 2, 5, 6, 7, 8;
  Era era = 1;
  ProtocolParameters pparams = 3;
  bytes header = 4;
}

message PraosHeaderEnvelopeResponse {
  Rejection rejection = 1;
}

message PraosVrfCheckRequest {
  Era era = 1;
  bytes header = 2;
  Nonce epoch_nonce = 3;
  bytes pool_vrf_key_hash = 4;
}

message PraosVrfCheckResponse {
  Rejection rejection = 1;
  bytes leader_value = 2;
  bytes nonce_value = 3;
}

message PraosLeaderCheckRequest {
  Era era = 1;
  bytes leader_value = 2;
  uint64 pool_stake = 3;
  uint64 total_stake = 4;
  Rational active_slot_coeff = 5;
}

message PraosLeaderCheckResponse {
  Rejection rejection = 1;
  bool is_leader = 2;
}

message PraosKesCheckRequest {
  Era era = 1;
  bytes header = 2;
  uint64 slots_per_kes_period = 3;
  uint64 max_kes_evolutions = 4;
}

message PraosKesCheckResponse {
  Rejection rejection = 1;
  // The KES evolution the header was signed at: the header's KES period less
  // the operational certificate's start period.
  uint64 kes_period = 2;
}

message PraosOpCertCheckRequest {
  ProtocolVersion protocol_version = 1;
  bytes header = 2;
  // Unset: no counter seen for this pool yet.
  optional uint64 last_counter = 3;
  bool pool_registered = 4;
  uint64 slots_per_kes_period = 5;
  uint64 max_kes_evolutions = 6;
}

message PraosOpCertCheckResponse {
  Rejection rejection = 1;
  uint64 new_counter = 2;
}

message PraosVrfKeyRegisteredRequest {
  bytes header = 1;
  repeated PoolStake pool_distribution = 2;
}

message PraosVrfKeyRegisteredResponse {
  Rejection rejection = 1;
  bytes pool_id = 2;
}

// vrf_output is the block's raw 64-byte VRF output (the nonce VRF output
// under TPraos); each era derives its nonce contribution from it.
message PraosNonceRollingRequest {
  Era era = 1;
  Nonce evolving = 2;
  bytes vrf_output = 3;
}

message PraosNonceRollingResponse {
  Rejection rejection = 1;
  Nonce evolving = 2;
}

message BlockNonceInput {
  uint64 slot = 1;
  bytes vrf_output = 2;
}

// The candidate nonce follows the evolving nonce for blocks below the
// freeze cutoff and stays put from there on. The cutoff is the first slot of
// the next epoch less the era's stability window, ceiling(3k/f) before
// Conway and ceiling(4k/f) from Conway. Every block slot lies in
// [epoch_first_slot, next_epoch_first_slot).
message PraosNonceCandidateRequest {
  reserved 4;
  Era era = 1;
  Nonce evolving = 2;
  Nonce candidate = 3;
  uint64 next_epoch_first_slot = 5;
  // Ordered by slot.
  repeated BlockNonceInput blocks = 6;
  uint64 security_param = 7;
  Rational active_slot_coeff = 8;
  uint64 epoch_first_slot = 9;
}

message PraosNonceCandidateResponse {
  Rejection rejection = 1;
  Nonce evolving = 2;
  Nonce candidate = 3;
}

message PraosNonceEpochRequest {
  Era era = 1;
  Nonce candidate = 2;
  // Previous epoch's last-applied-block nonce.
  Nonce previous_lab = 3;
  Nonce extra_entropy = 4;
}

message PraosNonceEpochResponse {
  Rejection rejection = 1;
  Nonce epoch_nonce = 2;
}

enum OverlaySlotKind {
  OVERLAY_SLOT_KIND_UNSPECIFIED = 0;
  OVERLAY_SLOT_KIND_ACTIVE = 1;
  OVERLAY_SLOT_KIND_NON_ACTIVE = 2;
  OVERLAY_SLOT_KIND_PRAOS = 3;
}

message TpraosOverlayScheduleRequest {
  uint64 slot = 1;
  uint64 epoch_first_slot = 2;
  Rational d = 3;
  Rational active_slot_coeff = 4;
  // Ordered as in genesis.
  repeated GenesisDelegation genesis_delegations = 5;
}

message TpraosOverlayScheduleResponse {
  Rejection rejection = 1;
  OverlaySlotKind kind = 2;
  bytes genesis_key_hash = 3;
}
