// Wire envelope for the stdin/stdout transport. Each frame is a 4-byte
// big-endian length followed by one serialized Call (driver to node) or
// Reply (node to driver). One call is outstanding at a time.
//
// Field numbers are blocked by area (meta 10, codec 100, rule 200, ...).
// Request and response for a function share the same field number. Add
// new functions at the end of their block; never renumber.

enum HarnessErrorCode {
  HARNESS_ERROR_CODE_UNSPECIFIED = 0;
  // The node does not implement this function.
  HARNESS_ERROR_CODE_UNIMPLEMENTED = 1;
  // The call could not be decoded or was missing required inputs.
  HARNESS_ERROR_CODE_BAD_REQUEST = 2;
  // The node accepts the function but not these inputs (for example an
  // era it does not support).
  HARNESS_ERROR_CODE_UNSUPPORTED = 3;
  // The adapter failed; this is a harness bug, not a finding.
  HARNESS_ERROR_CODE_INTERNAL = 4;
}

// HarnessError reports that a call was not evaluated. A domain rejection is
// not a harness error; it is the response's rejection field.
message HarnessError {
  HarnessErrorCode code = 1;
  string message = 2;
}

message Call {
  uint64 id = 1;
