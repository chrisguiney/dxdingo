    CodecBlockBodyRequest codec_block_body = 106;
    CodecBlockHeaderRequest codec_block_header = 107;
    CodecHfcBlockRequest codec_hfc_block = 108;
    CodecByronBlockRequest codec_byron_block = 109;
    CodecLedgerStateRequest codec_ledger_state = 110;
